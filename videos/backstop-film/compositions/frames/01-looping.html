    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["01-looping"] = tl;

        const cmdText = document.getElementById("d1-cmd-text");
        const tokenCounter = document.getElementById("d1-tokens");
        const fullCmd = "python runaway_agent.py";

        // Initial state - window is immediately visible at frame 0
        gsap.set("#d1-cursor", { opacity: 0, x: 1200, y: 650 });

        // 1. Typing command starts almost immediately
        const typingObj = { val: 0 };
        tl.to(typingObj, {
          val: fullCmd.length,
          duration: 1.0,
          ease: "none",
          onUpdate: function() {
            cmdText.textContent = fullCmd.slice(0, Math.round(typingObj.val));
          }
        }, 0.3);

        // 3. Lines reveal and counter increases
        const steps = [
          { id: "#d1-l0", tokens: 25, time: 2.1 },
          { id: "#d1-l1", tokens: 50, time: 2.6 },
          { id: "#d1-l2", tokens: 75, time: 3.1 },

          { id: "#d1-l8", tokens: 225, time: 6.1 },
          { id: "#d1-l9", tokens: 250, time: 6.6 }
        ];

        steps.forEach(function(s) {
          tl.to(s.id, { opacity: 1, duration: 0.15, ease: "power1.out" }, s.time);
          tl.add(function() {
            tokenCounter.textContent = "TOKENS: " + s.tokens;
          }, s.time);
        });

        // Danger glow rises as burn escalates
        tl.to("#d1-glow", { opacity: 1, duration: 3.0, ease: "power2.in" }, 3.5);
