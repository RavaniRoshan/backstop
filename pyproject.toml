[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "backstop-ai"
version = "0.6.0"
description = "In-process OpenAI SDK backpressure, budgets, retries, circuit breaking, and metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Backstop Contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
keywords = ["llm", "openai", "anthropic", "budgets", "guardrails", "backpressure", "retries", "circuit-breaker"]
dependencies = [
  "httpx>=0.27",
  "openai>=2.37,<4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
metrics = ["prometheus-client>=0.20"]
anthropic = ["anthropic>=0.98,<2"]
tokenizers = ["tiktoken>=0.7"]
fastapi = ["fastapi>=0.110"]
redis = ["redis>=5"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
test = [
  "anyio>=4",
  "pytest>=8",
  "pytest-cov>=5",
  "anthropic>=0.98,<2",
  "prometheus-client>=0.20,<0.27",
]

[project.urls]
Homepage = "https://github.com/RavaniRoshan/backstop"
Repository = "https://github.com/RavaniRoshan/backstop"
Issues = "https://github.com/RavaniRoshan/backstop/issues"
Changelog = "https://github.com/RavaniRoshan/backstop/blob/main/CHANGELOG.md"
Documentation = "https://github.com/RavaniRoshan/backstop/blob/main/docs/install.md"

[project.scripts]
backstop = "backstop.cli:main"
wedge = "wedge.cli:main"

[tool.hatch.build.targets.sdist]
exclude = ["/PLAN.md", "/.agents", "/docs/internal"]

[tool.hatch.build.targets.wheel]
packages = ["src/backstop", "src/wedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
  "real_openai: opt-in tests that call the real OpenAI API",
  "real_anthropic: opt-in tests that call the real Anthropic API",
]

[tool.ruff]
line-length = 100
target-version = "py310"
