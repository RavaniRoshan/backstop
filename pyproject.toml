[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "backstop-ai"
version = "0.7.0"
description = "In-process OpenAI SDK backpressure, budgets, retries, circuit breaking, and metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Backstop Contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
keywords = ["llm", "openai", "anthropic", "budgets", "guardrails", "backpressure", "retries", "circuit-breaker"]
dependencies = [
  "httpx>=0.27",
  "openai>=2.37,<4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
metrics = ["prometheus-client>=0.20"]
anthropic = ["anthropic>=0.98,<2"]
tokenizers = ["tiktoken>=0.7"]
fastapi = ["fastapi>=0.110", "uvicorn>=0.27"]
redis = ["redis>=5"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
test = [
  "anyio>=4",
  "pytest>=8",
  "pytest-cov>=5",
  "anthropic>=0.98,<2",
  "prometheus-client>=0.20,<0.27",
  "ruff>=0.6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.urls]
Homepage = "https://github.com/RavaniRoshan/backstop"
Repository = "https://github.com/RavaniRoshan/backstop"
Issues = "https://github.com/RavaniRoshan/backstop/issues"
Changelog = "https://github.com/RavaniRoshan/backstop/blob/main/CHANGELOG.md"
Documentation = "https://github.com/RavaniRoshan/backstop/blob/main/docs/install.md"

[project.scripts]
backstop = "backstop.cli:main"
wedge = "wedge.cli:main"

[tool.hatch.build.targets.sdist]
# An sdist is a source distribution, not a media CDN. The first cut of this list
# shipped a 2.5MB superseded GIF and 8.5MB of demo video inside the Python
# package, which nobody pip-installs and everybody downloads. What is kept is
# what a reader or a contributor needs: the code, the tests, the docs, the
# proofs, and install.sh and llms.txt, which are deliberate artefacts.
exclude = [
  "/PLAN.md",
  "/.agents",
  "/docs/internal",
  # Dev scratch, not part of the distribution.
  "/TODO.md",
  "/fix_wrapper.py",
  "/videos",
  "/research",
  "/wedge-test-fixture",
  "/.github",
  "/ts",                       # published to npm separately, from its own tree
  # The stale GIF pipeline. Its outputs are gone; see usecases/_build/media/.
  "/usecases/_build/__pycache__",
  "/usecases/_build/render.py",
  "/usecases/_build/make.py",
  "/usecases/_build/gifenc.py",
  "/usecases/_build/verify_identical.py",
  "/usecases/_build/briefs",
  # 8.5MB of video and poster stills. Read them on GitHub or the site.
  "/usecases/**/*.mp4",
  "/usecases/**/*.png",
  "/usecases/**/*.gif",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backstop", "src/wedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
  "real_openai: opt-in tests that call the real OpenAI API",
  "real_anthropic: opt-in tests that call the real Anthropic API",
]

[tool.ruff]
line-length = 100
target-version = "py310"

# The rule set is pinned EXPLICITLY on purpose. With only `ruff>=0.6` and ruff's
# implicit defaults, a new ruff release can enable a rule and turn a green
# branch red - which is exactly what happened: a newer ruff started reporting
# I001 (unsorted imports) and failed the build on code that had never changed.
# Lint that can break without a code change is not a gate, it is a coin flip.
[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501 is deliberately not enforced. `line-length` is set for the formatter, but
# this project has never held a 100-character limit and enabling it retrofits
# 216 unrelated lines, which is churn with real risk and no correctness value.
# The rule that actually matters - a name used but never defined (F821) - is on.
ignore = ["E501"]
