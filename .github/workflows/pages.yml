name: Pages

# The marketing page and the documentation site, published to GitHub Pages.
#
# GitHub Pages serves a project site from a subdirectory, so the site is built
# with that prefix (`SITE_BASE`). Everything in the site is base-aware: the
# framework's own links, the links the marketing page writes, and the links
# `scripts/prepare-content.mjs` rewrites into the documents.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: a second run must not race the first one's upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_BASE: /backstop
          SITE_URL: https://ravanishoshan.github.io
      - name: Check the internal links
        run: npm run check:links
        env:
          SITE_BASE: /backstop
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          # The site has never been published through Actions before; this
          # turns Pages on rather than failing the first run.
          enablement: true
      - name: Upload the artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
