name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # SDK versions tested must be compatible with httpx>=0.28 (which
        # removed the `proxies` kwarg). openai<1.90 and anthropic<0.40 pass
        # `proxies=None` internally and crash — so we test compatible majors.
        openai-version: ["latest"]
        anthropic-version: ["latest"]
        include:
          - python-version: "3.12"
            openai-version: "1.90.0"
            anthropic-version: "latest"
          - python-version: "3.12"
            openai-version: "latest"
            anthropic-version: "0.52.0"
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[test,metrics,anthropic]"
          if [ "${{ matrix.openai-version }}" != "latest" ]; then
            pip install "openai==${{ matrix.openai-version }}"
          fi
          if [ "${{ matrix.anthropic-version }}" != "latest" ]; then
            pip install "anthropic==${{ matrix.anthropic-version }}"
          fi
      - name: Run tests
        run: pytest
      - name: Run benchmark smoke
        run: python -m backstop benchmark

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build hatchling cyclonedx-bom
      - name: Build package
        run: python -m build
      - name: Generate SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cyclonedx-py environment -o sbom.json
          echo "SBOM generated: $(wc -c < sbom.json) bytes"
      - name: Sign release artifacts (cosign)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > /tmp/cosign.key
          cosign sign-blob --key /tmp/cosign.key dist/* --output signature.json
          rm -f /tmp/cosign.key
          echo "Artifact signatures written to signature.json"
      - name: Attest SLSA provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
        with:
          base-image-subdir: "latest"
          read-only: true
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --notes "Backstop ${{ github.ref_name }}" \
            sbom.json signature.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
