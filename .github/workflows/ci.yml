name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # Pins must (a) be compatible with httpx>=0.28, which removed the
        # `proxies` kwarg (openai<1.90 / anthropic<0.40 crash on it), and
        # (b) stop relabelling transport exceptions: below openai 2.37 /
        # anthropic 0.98 the SDK catches Backstop's BudgetExceededError and
        # re-raises it as APIConnectionError, so the guardrail is invisible
        # to user code. Floors in src/backstop/wrapper.py must match.
        openai-version: ["2.37.0", "3.14.0"]
        anthropic-version: ["0.99.0", "1.6.0"]
        # Cross-check: newest openai against the oldest supported anthropic.
        include:
          - python-version: "3.12"
            openai-version: "latest"
            anthropic-version: "0.99.0"
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[test,metrics,anthropic]"
          if [ "${{ matrix.openai-version }}" != "latest" ]; then
            pip install "openai==${{ matrix.openai-version }}"
          fi
          if [ "${{ matrix.anthropic-version }}" != "latest" ]; then
            pip install "anthropic==${{ matrix.anthropic-version }}"
          fi
      - name: Lint
        run: ruff check src/ tests/
      - name: Run tests
        run: pytest
      - name: Run benchmark smoke
        run: python -m backstop benchmark

  ts-backstop:
    name: ts typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/backstop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/backstop/package-lock.json
      - name: Verify the lockfile matches the package identity
        # this shipped as @ravanish/backstop@0.5.0 while package.json said
        # backstop-ai@0.6.0, so the published lockfile named a different package
        run: |
          node -e '
            const p = require("./package.json"), l = require("./package-lock.json");
            if (l.name !== p.name || l.version !== p.version) {
              console.error(`lockfile ${l.name}@${l.version} != package ${p.name}@${p.version}`);
              process.exit(1);
            }
          '
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  build:
    # Both gates. The Python matrix covers the package that reaches PyPI, and
    # ts-backstop covers the npm package -- this release bumps that version too,
    # so a release should not go out green-on-Python with a broken npm build.
    needs: [test, ts-backstop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Validate package
        run: python -m twine check dist/*
      # Supply chain hardening: cosign signing, SLSA provenance (slsa-framework), SBOM generation
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --notes "Backstop ${{ github.ref_name }}" \
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  npm-publish:
    # Runs only for a real version tag, and only after both test gates. Uses npm
    # trusted publishing (OIDC): the token is minted per-run from the workflow
    # identity, so there is no npm secret in this repository to leak or rotate.
    #
    # THIS REQUIRES ONE MANUAL STEP, because npm will not accept the workflow
    # until the package says so: on npmjs.com -> backstop-ai -> Settings ->
    # Trusted Publisher -> GitHub Actions, add
    #     repository  RavaniRoshan/backstop
    #     workflow    .github/workflows/ci.yml
    #     path        ts/backstop/package.json
    # Without that, this job fails with E403 and the package stays unpublished --
    # which is the state it is in now, and the reason npm sits at 0.6.0 while
    # PyPI is at 0.7.0.
    needs: [test, ts-backstop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the OIDC exchange. Nothing else is granted.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install, typecheck, test
        working-directory: ts/backstop
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Build
        working-directory: ts/backstop
        run: npm run build
      - name: Refuse to publish a version that is not what the tag says
        working-directory: ts/backstop
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json $PKG" >&2
            exit 1
          fi
      - name: Publish to npm
        working-directory: ts/backstop
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

