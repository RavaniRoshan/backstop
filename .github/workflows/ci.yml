name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # Test against the latest patch of each recent SDK major to catch
        # transport-injection drift early. openai/anthropic both change
        # internal attribute names between majors.
        openai-version: ["latest"]
        anthropic-version: ["latest"]
        include:
          - python-version: "3.12"
            openai-version: "1.54.0"
            anthropic-version: "latest"
          - python-version: "3.12"
            openai-version: "latest"
            anthropic-version: "0.40.0"
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[test,metrics,anthropic]"
          if [ "${{ matrix.openai-version }}" != "latest" ]; then
            pip install "openai==${{ matrix.openai-version }}"
          fi
          if [ "${{ matrix.anthropic-version }}" != "latest" ]; then
            pip install "anthropic==${{ matrix.anthropic-version }}"
          fi
      - name: Run tests
        run: pytest
      - name: Run benchmark smoke
        run: python -m backstop benchmark

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build hatchling
      - name: Build package
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --notes "Backstop ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
