name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # Pins must (a) be compatible with httpx>=0.28, which removed the
        # `proxies` kwarg (openai<1.90 / anthropic<0.40 crash on it), and
        # (b) stop relabelling transport exceptions: below openai 2.37 /
        # anthropic 0.98 the SDK catches Backstop's BudgetExceededError and
        # re-raises it as APIConnectionError, so the guardrail is invisible
        # to user code. Floors in src/backstop/wrapper.py must match.
        openai-version: ["2.37.0", "3.14.0"]
        anthropic-version: ["0.99.0", "1.6.0"]
        # Cross-check: newest openai against the oldest supported anthropic.
        include:
          - python-version: "3.12"
            openai-version: "latest"
            anthropic-version: "0.99.0"
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[test,metrics,anthropic]"
          if [ "${{ matrix.openai-version }}" != "latest" ]; then
            pip install "openai==${{ matrix.openai-version }}"
          fi
          if [ "${{ matrix.anthropic-version }}" != "latest" ]; then
            pip install "anthropic==${{ matrix.anthropic-version }}"
          fi
      - name: Run tests
        run: pytest
      - name: Run benchmark smoke
        run: python -m backstop benchmark

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Validate package
        run: python -m twine check dist/*
      # Supply chain hardening: cosign signing, SLSA provenance (slsa-framework), SBOM generation
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --notes "Backstop ${{ github.ref_name }}" \
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
